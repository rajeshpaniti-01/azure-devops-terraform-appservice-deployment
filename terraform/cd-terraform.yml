trigger: none

resources:
  pipelines:
  - pipeline: terraformCI
    source: CI-Terraform
    trigger: true

pool:
  vmImage: ubuntu-latest

stages:
- stage: Deploy
  jobs:
  - deployment: TerraformApply
    environment: Production

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - bash: |
              set -e

              TERRAFORM_VERSION="1.9.8"

              wget -q https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
              unzip -o terraform_${TERRAFORM_VERSION}_linux_amd64.zip
              sudo mv terraform /usr/local/bin/

              terraform version
            displayName: Install Terraform

          - bash: |
              echo "Source directory:"
              echo $(Build.SourcesDirectory)

              find $(Build.SourcesDirectory) | head -200
            displayName: Show Full Repo Structure

          - task: AzureCLI@2
            displayName: Terraform Init
            inputs:
              azureSubscription: terraform-azure-sc
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                export ARM_USE_OIDC=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export ARM_OIDC_TOKEN=$idToken

                terraform init

                terraform providers

          - download: terraformCI
            artifact: terraform-plan

          - bash: |
              echo "Downloaded files:"
              find $(Pipeline.Workspace)
            displayName: Verify Download

          - task: AzureCLI@2
            displayName: Terraform Apply
            inputs:
              azureSubscription: terraform-azure-sc
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                export ARM_USE_OIDC=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export ARM_OIDC_TOKEN=$idToken

                terraform apply -auto-approve \
                  $(Pipeline.Workspace)/terraformCI/terraform-plan/tfplan
